name: Idees macro (Telegram)

on:
  schedule:
    - cron: '35 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Polices pour les charts
        run: sudo apt-get install -y fonts-dejavu-core > /dev/null 2>&1 || true
      - name: Bibliotheque de dessin
        run: npm install --no-save --no-audit --no-fund @napi-rs/canvas@0.1
      - name: Idees du jour
        run: node macro_bot.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sauvegarde des donnees du jour
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add macro_state.json
          if [ -f macro_add.json ]; then git add macro_add.json; fi
          git diff --cached --quiet || (git commit -m "macro : donnees du jour" && git pull --rebase && git push)
