name: Whales Hyperliquid (Telegram)

# Suivi des portefeuilles Hyperliquid listés dans whale_bot.mjs : alerte quand une grosse position
# est ouverte ou retournée, avec le chart du coin (bougies 4h, entrée, liquidation). Secrets : TG_BOT_TOKEN, TG_CHAT_ID.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: whale-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dessin des charts
        run: |
          sudo apt-get install -y fonts-dejavu-core > /dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund @napi-rs/canvas@0.1
      - name: Etat (positions du passage precedent)
        uses: actions/cache/restore@v4
        with:
          path: whale_state.json
          key: whale-state-v2-${{ github.run_id }}
          restore-keys: whale-state-v2-
      - name: Positions des whales
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node whale_bot.mjs
      - name: Sauvegarde de l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: whale_state.json
          key: whale-state-v2-${{ github.run_id }}
